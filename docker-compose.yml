# Compose project name is pinned so this stack can share a Docker host with
# other stacks (one compose project per directory under /opt/stacks).
name: fantasy-football

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Tagged with the app version rather than :latest so a rebuild that goes
    # wrong leaves the previous image identifiable and re-taggable.
    image: gridiron-hq:0.1.0
    container_name: gridiron-hq
    restart: unless-stopped
    ports:
      # Host 8090 — 8000 and 8080 are taken by other services on the box.
      - "8090:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      # SCHEDULER_ENABLED: "true"  # set to "false" to disable background auto-refresh
    volumes:
      - ./data:/app/data
      # Secrets live in one mode-600 .env beside this file and are mounted at
      # the path app.config.Settings reads (container WORKDIR is /app/backend),
      # so there is no second copy to keep in sync and nothing baked into the
      # image. Local non-Docker dev reads backend/secrets.env directly instead.
      # See README.md / deploy/server-setup.md.
      - ./.env:/app/backend/secrets.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
