services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: gridiron-hq:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - ./data:/app/data
