[project]
name = "gridiron-hq-backend"
version = "0.1.0"
description = "Self-hosted fantasy football helper API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "yahoo-fantasy-api>=2.12.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # objectpath (a yahoo-fantasy-api dependency) is full of `is` vs `==`
    # comparisons against int literals; nothing we can fix from here.
    "ignore::SyntaxWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
